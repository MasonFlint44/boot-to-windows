# Publishes a GitHub release when a version tag is pushed:
#
#   git tag -a v1.0.0 -m 'Boot to Windows 1.0.0' && git push origin v1.0.0
#
# The tag has to match metadata.json's version-name, and CHANGELOG.md needs a
# dated section for it, which becomes the release notes. CI runs first and the
# release gets the zip it tested.
#
# Running it by hand (Actions > Release > Run workflow) does a dry run that
# skips publishing and keeps the zip and notes as a workflow artifact.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from the tag (or metadata.json for a dry run)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              version=${GITHUB_REF_NAME#v}
          else
              version=$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')
          fi
          tools/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: dist
      - name: Release notes
        run: tools/release-notes.sh "$VERSION" > notes.md
      - name: Publish
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.shell-extension.zip \
              --verify-tag --title "Boot to Windows $VERSION" --notes-file notes.md
      - name: Keep the dry run's output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md
