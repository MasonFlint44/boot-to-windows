name: CI
on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: sudo apt-get update && sudo apt-get install -y gjs
      - run: npm test
      - name: Pack
        run: |
          sudo apt-get install -y gnome-shell-common gnome-shell || true
          ./tools/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: build/*.shell-extension.zip
