name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:    # release.yml runs all of CI before publishing

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: shellcheck
        run: >
          shellcheck -x -e SC1091,SC2012
          tests/integration/run.sh tests/integration/test-all.sh
          tests/integration/harness/*.sh tests/integration/harness/shims/pkexec
          tests/integration/hooks/*.sh tools/*.sh
          tests/integration/tests/*.sh tests/integration/selftest/*.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gnome-shell
      - run: npm test
      - run: ./tools/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: build/*.shell-extension.zip

  # Integration tests on every version in metadata.json's shell-version, plus
  # the harness self-tests. Only list a version there if its job passes.
  gnome-shell:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gnome: [45, 46, 47, 48, 49, 50]
    steps:
      - uses: actions/checkout@v4
      - name: Check the matrix matches metadata.json
        run: |
          python3 -c 'import json,sys; v=json.load(open("extension/metadata.json"))["shell-version"]; sys.exit(0 if "${{ matrix.gnome }}" in v else "not in shell-version")'
      - name: Integration suites on GNOME ${{ matrix.gnome }}
        run: tests/integration/test-all.sh ${{ matrix.gnome }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.gnome }}-logs
          path: tests/integration/.work/
          include-hidden-files: true
